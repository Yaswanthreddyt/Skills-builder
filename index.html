<!DOCTYPE html>
<html lang="en" data-world="runway">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runway: learn a skill, day by day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root,:root[data-world="runway"]{--paper:#F2F2F7;--card:#FFFFFF;--ink:#1D1D1F;--muted:#6E6E73;--line:#E5E5EA;--accent:#5856D6;--accent-soft:#EDEDFB;--on-accent:#FFFFFF;--hi:#FF9500;--hi-soft:#FFF1DE;--hi-ink:#8A4B00;--good:#30B355;--good-soft:#E1F6E6;--bad:#FF3B30;--bad-soft:#FFE9E7;--violet:#AF52DE;--violet-soft:#F5E7FB;--board:#1D1D1F;--board-ink:#FF9F0A;--grid:transparent;--glass:rgba(255,255,255,.72);--head:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--body:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--mono:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;--r-card:22px;--r-btn:980px;--r-in:14px;--shadow:0 1px 2px rgba(0,0,0,.04), 0 12px 28px -12px rgba(20,20,30,.18);--hw:650;--hls:-.01em;}
:root[data-world="cloud"]{--paper:#EAF3FF;--card:rgba(255,255,255,.82);--ink:#0B1E3D;--muted:#5B7292;--line:rgba(11,30,61,.10);--accent:#007AFF;--accent-soft:#E4F0FF;--on-accent:#FFFFFF;--hi:#FF9F0A;--hi-soft:#FFF1DE;--hi-ink:#8A4B00;--good:#2AAE57;--good-soft:#E1F7E9;--bad:#FF453A;--bad-soft:#FFE9E7;--violet:#5E5CE6;--violet-soft:#EBEBFC;--board:#FFFFFF;--board-ink:#0B1E3D;--grid:transparent;--glass:rgba(255,255,255,.6);--head:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--body:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--mono:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;--r-card:28px;--r-btn:980px;--r-in:16px;--shadow:0 1px 2px rgba(10,40,90,.05), 0 20px 40px -20px rgba(10,60,140,.28);--hw:600;--hls:-.01em;}
:root[data-world="data"]{--paper:#F4F6F8;--card:#FFFFFF;--ink:#0E1420;--muted:#5D6773;--line:#E3E7EC;--accent:#0A8F92;--accent-soft:#DEF3F3;--on-accent:#FFFFFF;--hi:#FF9500;--hi-soft:#FFF1DE;--hi-ink:#8A4B00;--good:#2AAE57;--good-soft:#E1F7E9;--bad:#D6392F;--bad-soft:#FBE4E2;--violet:#5856D6;--violet-soft:#EDEDFB;--board:#0E1420;--board-ink:#9BE9EC;--grid:rgba(10,143,146,.07);--glass:rgba(255,255,255,.78);--head:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--body:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--mono:"JetBrains Mono","SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--r-card:18px;--r-btn:980px;--r-in:12px;--shadow:0 1px 2px rgba(0,0,0,.04), 0 16px 32px -16px rgba(10,60,63,.22);--hw:600;--hls:-.01em;}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--paper:#000000;--card:#1C1C1E;--ink:#F5F5F7;--muted:#98989D;--line:#2C2C2E;--accent:#7D7AFF;--accent-soft:#211F3E;--on-accent:#0A0A0F;--hi:#FF9F0A;--hi-soft:#3A2A0C;--hi-ink:#FFB454;--good:#32D74B;--good-soft:#0F2E17;--bad:#FF453A;--bad-soft:#3A1613;--violet:#BF5AF2;--violet-soft:#2C1839;--board:#1C1C1E;--board-ink:#FF9F0A;--grid:transparent;--glass:rgba(28,28,30,.72);}
:root[data-world="cloud"]:not([data-theme="light"]){--paper:#050B18;--card:rgba(20,32,58,.78);--ink:#EAF2FF;--muted:#8FA6C9;--line:rgba(234,242,255,.12);--accent:#0A84FF;--accent-soft:#122C4F;--on-accent:#04070D;--hi:#FF9F0A;--hi-soft:#3A2A0C;--hi-ink:#FFB454;--good:#32D74B;--good-soft:#0F2E17;--bad:#FF453A;--bad-soft:#3A1613;--violet:#7D7AFF;--violet-soft:#211F3E;--board:#101E38;--board-ink:#EAF2FF;--grid:transparent;--glass:rgba(16,30,56,.6);}
:root[data-world="data"]:not([data-theme="light"]){--paper:#07090C;--card:#111418;--ink:#EDF1F4;--muted:#8B95A1;--line:#1F242A;--accent:#37C5C8;--accent-soft:#0F2C2D;--on-accent:#03181A;--hi:#FFB454;--hi-soft:#3A2A0C;--hi-ink:#FFB454;--good:#32D74B;--good-soft:#0F2E17;--bad:#FF6B60;--bad-soft:#3A1613;--violet:#8B89FF;--violet-soft:#211F3E;--board:#0A0D11;--board-ink:#8FE7EA;--grid:rgba(55,197,200,.06);--glass:rgba(17,20,24,.78);}
}
:root[data-theme="dark"]{--paper:#000000;--card:#1C1C1E;--ink:#F5F5F7;--muted:#98989D;--line:#2C2C2E;--accent:#7D7AFF;--accent-soft:#211F3E;--on-accent:#0A0A0F;--hi:#FF9F0A;--hi-soft:#3A2A0C;--hi-ink:#FFB454;--good:#32D74B;--good-soft:#0F2E17;--bad:#FF453A;--bad-soft:#3A1613;--violet:#BF5AF2;--violet-soft:#2C1839;--board:#1C1C1E;--board-ink:#FF9F0A;--grid:transparent;--glass:rgba(28,28,30,.72);}
:root[data-theme="dark"][data-world="cloud"]{--paper:#050B18;--card:rgba(20,32,58,.78);--ink:#EAF2FF;--muted:#8FA6C9;--line:rgba(234,242,255,.12);--accent:#0A84FF;--accent-soft:#122C4F;--on-accent:#04070D;--hi:#FF9F0A;--hi-soft:#3A2A0C;--hi-ink:#FFB454;--good:#32D74B;--good-soft:#0F2E17;--bad:#FF453A;--bad-soft:#3A1613;--violet:#7D7AFF;--violet-soft:#211F3E;--board:#101E38;--board-ink:#EAF2FF;--grid:transparent;--glass:rgba(16,30,56,.6);}
:root[data-theme="dark"][data-world="data"]{--paper:#07090C;--card:#111418;--ink:#EDF1F4;--muted:#8B95A1;--line:#1F242A;--accent:#37C5C8;--accent-soft:#0F2C2D;--on-accent:#03181A;--hi:#FFB454;--hi-soft:#3A2A0C;--hi-ink:#FFB454;--good:#32D74B;--good-soft:#0F2E17;--bad:#FF6B60;--bad-soft:#3A1613;--violet:#8B89FF;--violet-soft:#211F3E;--board:#0A0D11;--board-ink:#8FE7EA;--grid:rgba(55,197,200,.06);--glass:rgba(17,20,24,.78);}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ease:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.34,1.56,.64,1)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--paper);transition:background-color .5s var(--ease)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;transition:color .5s var(--ease)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
h1,h2,h3,h4{font-family:var(--head);margin:0;line-height:1.12;letter-spacing:var(--hls);font-weight:var(--hw)}
h1{font-size:clamp(34px,5.2vw,56px);letter-spacing:-.02em}
h2{font-size:clamp(24px,2.8vw,30px);letter-spacing:-.015em}
h3{font-size:21px;letter-spacing:-.01em}
h4{font-size:19px;margin:26px 0 10px}
.muted{color:var(--muted)}.small{font-size:14px}
.sr{position:absolute;left:-9999px}
.mono{font-family:var(--mono)}

/* ---------- scenes: the page background per world ---------- */
.scene{position:fixed;inset:0;z-index:-1;opacity:0;transition:opacity 1s var(--ease);pointer-events:none;overflow:hidden}
:root[data-world="runway"] #scene-runway,:root[data-world="cloud"] #scene-cloud,:root[data-world="data"] #scene-data{opacity:1}
#scene-runway::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:3px;background:repeating-linear-gradient(to bottom,var(--hi) 0 26px,transparent 26px 52px);opacity:.35}
#scene-cloud .sky{position:absolute;inset:0;background:linear-gradient(180deg,#CFE6FF 0%,#E3F1FF 40%,#F4F9FF 75%,#FBFDFF 100%)}
#scene-cloud .sun{position:absolute;right:8%;top:6%;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#FFF6DE 0%,rgba(255,240,190,.5) 38%,rgba(255,240,190,0) 70%)}
#scene-cloud .stars{display:none;position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 12%,#fff,transparent),radial-gradient(1px 1px at 40% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 86% 34%,#fff,transparent),radial-gradient(1px 1px at 25% 46%,#fff,transparent),radial-gradient(1px 1px at 58% 52%,#fff,transparent)}
.cl{position:absolute;left:0;color:#fff;opacity:.85;animation:drift linear infinite}
.cl svg{display:block;width:100%;height:auto}
.cl.c1{top:9%;width:300px;animation-duration:150s;animation-delay:-40s}
.cl.c2{top:24%;width:210px;opacity:.65;animation-duration:200s;animation-delay:-120s}
.cl.c3{top:47%;width:380px;opacity:.8;animation-duration:180s;animation-delay:-20s}
.cl.c4{top:68%;width:260px;opacity:.7;animation-duration:220s;animation-delay:-90s}
.cl.c5{top:84%;width:340px;opacity:.85;animation-duration:160s;animation-delay:-60s}
@keyframes drift{from{transform:translateX(-35vw)}to{transform:translateX(112vw)}}
:root[data-theme="dark"] #scene-cloud .sky{background:linear-gradient(180deg,#03060F 0%,#081A2A 45%,#0E2350 100%)}
:root[data-theme="dark"] #scene-cloud .sun{background:radial-gradient(circle,#EFEAFF 0%,rgba(190,200,255,.25) 32%,rgba(190,200,255,0) 66%);width:150px;height:150px}
:root[data-theme="dark"] #scene-cloud .stars{display:block}
:root[data-theme="dark"] .cl{color:#3C4E7D;opacity:.35}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #scene-cloud .sky{background:linear-gradient(180deg,#03060F 0%,#081A2A 45%,#0E2350 100%)}
  :root:not([data-theme="light"]) #scene-cloud .sun{background:radial-gradient(circle,#EFEAFF 0%,rgba(190,200,255,.25) 32%,rgba(190,200,255,0) 66%);width:150px;height:150px}
  :root:not([data-theme="light"]) #scene-cloud .stars{display:block}
  :root:not([data-theme="light"]) .cl{color:#3C4E7D;opacity:.35}
}
#scene-data{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
#scene-data::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(10,143,146,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(10,143,146,.06) 1px,transparent 1px);background-size:160px 160px;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%)}

/* ---------- header: frosted glass material ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
:root[data-theme="dark"] .top{box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--head);font-size:22px;font-weight:700;padding:10px 0;letter-spacing:-.02em}
.brand svg{flex:none}
.world-tag{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);background:var(--line);border-radius:999px;padding:3px 11px;letter-spacing:.01em;transition:all .4s var(--ease)}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;flex:1;justify-content:center}
.tab{background:none;border:0;padding:16px 15px;color:var(--muted);font-weight:600;font-size:15px;border-bottom:2.5px solid transparent;display:flex;gap:8px;align-items:center;white-space:nowrap;transition:color .3s var(--ease),border-color .3s var(--ease)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.gating .tabs{visibility:hidden}
.acct{display:flex;align-items:center;gap:8px;background:var(--line);border:0;border-radius:999px;padding:4px 14px 4px 4px;font-weight:600;font-size:14px;transition:transform .25s var(--ease-spring)}
.acct:active{transform:scale(.96)}
.acct img{width:26px;height:26px;border-radius:50%}
.acct .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.acct.guest .dot{background:var(--hi)}
.fx{border-top:1px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--muted);background:transparent}
.fx .wrap{justify-content:flex-start;display:flex;gap:18px;align-items:center;padding-top:6px;padding-bottom:6px;overflow-x:auto;white-space:nowrap}
.fx b{color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 7px;font-weight:700}
.badge{background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:10px;min-width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.savestate{font-size:12px;color:var(--muted);min-width:70px;text-align:right}
main.wrap{padding:32px 22px 90px}
#view.swap{animation:worldIn .5s var(--ease) both}
@keyframes worldIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- controls ---------- */
.btn{border:1px solid transparent;border-radius:var(--r-btn);padding:12px 22px;font-weight:600;font-size:15px;background:var(--accent);color:var(--on-accent);text-align:center;text-decoration:none;display:inline-block;transition:transform .2s var(--ease-spring),filter .2s var(--ease),box-shadow .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 16px -8px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.hi{background:var(--hi);color:#2b1d00;box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 16px -8px color-mix(in srgb,var(--hi) 60%,transparent)}
.btn.sm{padding:8px 16px;font-size:13.5px}
.btn.block{display:block;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;font-size:14.5px;font-weight:600;color:var(--ink);transition:all .2s var(--ease)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.radio-chip{position:relative;display:inline-block}
.radio-chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.radio-chip span{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;font-size:14.5px;font-weight:600;display:inline-block;transition:all .2s var(--ease)}
.radio-chip input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.radio-chip input:focus-visible+span{outline:2.5px solid var(--accent);outline-offset:2px}
.lbl{display:block;font-size:14.5px;font-weight:600;margin-bottom:7px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r-in);padding:13px 15px;font-size:16px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea{min-height:88px;resize:vertical}
.field{margin-bottom:20px}
.err{color:var(--bad);font-size:13.5px;margin-top:6px}
.hint{color:var(--muted);font-size:13.5px;margin-top:6px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--line);color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:11.5px;font-weight:600;color:var(--muted);margin-right:6px;line-height:19px}
.tag.free{color:var(--good);border-color:transparent;background:var(--good-soft)}
.s-Applied{background:var(--accent-soft);color:var(--accent)}.s-Screening{background:var(--hi-soft);color:var(--hi-ink)}.s-Interview{background:var(--violet-soft);color:var(--violet)}.s-Offer{background:var(--good-soft);color:var(--good)}.s-Rejected{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;box-shadow:var(--shadow)}
.bar{height:7px;border-radius:8px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .6s var(--ease)}
.bar.done>i{background:var(--good)}
.empty{text-align:center;padding:48px 12px;max-width:440px;margin:0 auto}
.empty p{color:var(--muted);margin:8px 0 20px}
.lead{color:var(--muted);font-size:18px;max-width:60ch;margin:12px 0 28px;line-height:1.5}
.note{background:var(--accent-soft);border-radius:var(--r-in);padding:13px 16px;margin:0 0 18px;font-size:14.5px}
.banner{border-radius:var(--r-card);padding:16px 18px;margin:0 0 18px;background:var(--good-soft)}
.banner.warn{background:var(--hi-soft)}
.banner b{display:block;margin-bottom:3px;font-family:var(--head);font-size:18px}

/* ---------- builder ---------- */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:24px;align-items:center;margin-bottom:30px}
.hero-art{width:100%;max-width:440px;justify-self:end}
.portals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:30px}
.portal{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px 18px;display:flex;flex-direction:column;gap:7px;transition:transform .3s var(--ease-spring),box-shadow .3s var(--ease);box-shadow:var(--shadow)}
.portal:hover{transform:translateY(-3px)}
.portal[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent),var(--shadow)}
.portal svg{width:100%;height:64px;display:block;border-radius:calc(var(--r-card) - 6px);background:var(--accent-soft)}
.portal b{font-family:var(--head);font-size:20px;font-weight:var(--hw);letter-spacing:-.01em}
.portal span{font-size:13.5px;color:var(--muted)}
.builder{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:start}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:0 0 28px}
.role{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-in);padding:12px 14px;transition:all .2s var(--ease)}
.role b{display:block;font-family:var(--head);font-size:17px;font-weight:var(--hw);line-height:1.2;letter-spacing:-.01em}
.role span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px;line-height:1.3}
.role[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.preview{position:sticky;top:110px;background:var(--board);color:var(--board-ink);border-radius:var(--r-card);padding:24px;box-shadow:var(--shadow)}
.preview h3{color:var(--board-ink);font-size:20px;margin-bottom:8px}
.preview .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--board-ink) 15%,transparent);font-family:var(--mono);font-size:16px;font-weight:600}
.preview .row span:first-child{opacity:.7;font-weight:500;font-family:var(--body)}
.preview p{margin:12px 0 0;font-size:14.5px;opacity:.85;line-height:1.5}

/* ---------- RUNWAY world: departure board ---------- */
.board{background:var(--board);color:var(--board-ink);border-radius:var(--r-card);padding:26px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 32px;align-items:end;box-shadow:var(--shadow)}
.board .cap,.cap{font-family:var(--head);font-size:13px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;opacity:.6;margin-bottom:10px}
.flaps{font-family:var(--head);font-weight:700;line-height:1;display:flex;flex-wrap:wrap;gap:3px}
.flaps.big{font-size:clamp(28px,4.8vw,48px);letter-spacing:-.01em}.flaps.sm{font-size:clamp(16px,2.4vw,21px);margin-top:10px;opacity:.85}
.fl{display:inline-flex;align-items:center;justify-content:center;min-width:.62em;padding:0 .08em;height:1.22em;background:rgba(255,255,255,.08);border-radius:6px;position:relative}
.fl.sp{background:none}
.stat-box{text-align:right}.stat-box .st{font-family:var(--head);font-size:22px;font-weight:700}
.stat-box.late .st{color:#FF9C94}
.board .acts,.deck .acts{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.board .btn.ghost{background:rgba(255,255,255,.08);color:var(--board-ink);border-color:transparent}
.approach{display:block;width:100%;height:auto}
.approach .lg{fill:var(--hi);opacity:.2;animation:strobe 1.8s ease-in-out infinite;animation-delay:calc(var(--i) * .07s)}
@keyframes strobe{0%,8%{opacity:.9}30%,100%{opacity:.12}}

/* ---------- CLOUD world: flight deck & altitude ---------- */
.deck{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:20px 32px;background:var(--board);color:var(--board-ink);border-radius:var(--r-card);padding:32px 36px;box-shadow:var(--shadow);position:relative;margin-top:20px}
.deck>*{position:relative;z-index:1}
.deck .cap{text-transform:none;letter-spacing:0;font-size:16px;color:var(--accent);opacity:1;font-weight:600}
.deck-title{font-size:clamp(28px,4.2vw,44px);line-height:1.08;margin-bottom:8px;letter-spacing:-.02em}
.deck-sub{margin:0 0 14px;font-size:17px;color:var(--muted)}
.status-chip{display:inline-block;background:var(--good-soft);color:var(--good);border-radius:999px;padding:6px 16px;font-family:var(--head);font-size:15px;font-weight:600;margin-bottom:16px}
.status-chip.late{background:var(--hi-soft);color:var(--hi-ink)}
.alt{position:relative;height:230px;margin:6px 0}
.alt-scale{position:absolute;left:44px;top:0;bottom:0;width:14px;border-radius:10px;background:linear-gradient(0deg,#6FD3A0,#7FC0F5 30%,#3E85F0 70%,#1B3D91)}
.alt-tick{position:absolute;left:66px;font-size:11.5px;color:var(--muted);transform:translateY(50%);font-weight:600}
.alt-tick::before{content:"";position:absolute;left:-22px;top:50%;width:14px;height:1.5px;background:var(--muted);opacity:.5}
.plane{position:absolute;left:14px;bottom:0;width:74px;transform:translateY(50%);transition:transform 1.4s var(--ease);filter:drop-shadow(0 8px 10px rgba(20,60,130,.25));will-change:transform}
.alt-read{position:absolute;right:0;bottom:-12px;font-family:var(--head);font-size:20px;color:var(--accent);font-weight:650}
.deck .btn.ghost{background:transparent;border-color:var(--accent);color:var(--accent)}

/* ---------- DATA world: SQL console ---------- */
.console{background:var(--board);color:var(--board-ink);border-radius:var(--r-card);box-shadow:var(--shadow);font-family:var(--mono);font-size:14.5px;overflow:hidden}
.console-bar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid color-mix(in srgb,var(--board-ink) 15%,transparent);font-size:12px;opacity:.7}
.console-bar i{width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.35}
.console pre{margin:0;padding:18px 20px 10px;white-space:pre-wrap;line-height:1.75}
.console .k{color:#F7A94B;font-weight:700}.console .f{color:#7FD6DA}.console .s{color:#C7B6FF}
.ln{display:block;animation:lnIn .35s both;animation-delay:calc(var(--i) * .18s)}
@keyframes lnIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.result{margin:8px 20px 6px;border:1px solid color-mix(in srgb,var(--board-ink) 15%,transparent);border-radius:10px;overflow:auto}
.result table{width:100%;border-collapse:collapse;font-size:13.5px}
.result th,.result td{text-align:left;padding:9px 13px;white-space:nowrap}
.result th{color:#F7A94B;border-bottom:1px solid color-mix(in srgb,var(--board-ink) 15%,transparent);font-weight:700}
.result td{font-size:15px}
.result tr:nth-child(2) td{animation:lnIn .5s both;animation-delay:1.1s}
.console .foot{padding:8px 20px 4px;font-size:11.5px;opacity:.6}
.console .acts{display:flex;gap:10px;flex-wrap:wrap;padding:12px 20px 20px}
.console .btn.ghost{background:transparent;color:var(--board-ink);border-color:color-mix(in srgb,var(--board-ink) 30%,transparent)}
.chart{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--muted);font-family:var(--mono);font-size:11px}
.chart .plan{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5;fill:none}
.chart .proj{stroke:var(--hi);stroke-width:1.5;stroke-dasharray:2 5;stroke-linecap:round;fill:none}
.chart .act{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1200;animation:draw 1.4s var(--ease) both}
.chart .area{fill:var(--accent);opacity:.08}
.chart .now{stroke:var(--hi);stroke-width:1.5}
@keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}

/* ---------- roadmap layout (shared) ---------- */
.facts{display:flex;gap:30px;flex-wrap:wrap;margin:20px 0}
.facts div{font-family:var(--head);font-size:28px;font-weight:700;line-height:1;letter-spacing:-.02em}
.facts span{display:block;font-family:var(--body);font-size:12.5px;font-weight:600;color:var(--muted);margin-top:5px}
.stack{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
.sect{margin-top:50px}.sect>h2{margin-bottom:6px}.sect>.lead{margin:0 0 20px;font-size:16px}
.rw{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));gap:8px 6px;align-items:center}
.rw .mo{font-family:var(--head);font-size:13px;color:var(--muted);font-weight:600}
.rw .dh{font-size:11.5px;color:var(--muted);text-align:center}
.lt{width:100%;max-width:38px;aspect-ratio:1;justify-self:center;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:11.5px;color:var(--muted);padding:0;position:relative;transition:transform .2s var(--ease-spring)}
.lt:hover{transform:scale(1.1)}
.lt[data-s=done]{background:var(--good);border-color:var(--good);color:#fff;box-shadow:0 0 0 3px var(--good-soft)}
.lt[data-s=today]{background:var(--hi);border-color:var(--hi);color:#2b1d00;font-weight:700}
.lt[data-s=plan]{border-color:var(--accent);color:var(--ink)}
.lt[data-s=missed]{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.lt[data-s=rest]{border-style:dashed;opacity:.5}.lt[data-s=free]{opacity:.25}
.lt.tg{border-radius:10px;border-color:var(--ink);border-width:2.5px}
.lt[aria-current="date"]{outline:2.5px solid var(--ink);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line);vertical-align:-1px;margin-right:6px}
.legend .d{background:var(--good);border-color:var(--good)}.legend .t{background:var(--hi);border-color:var(--hi)}.legend .p{border-color:var(--accent)}.legend .m{background:var(--bad-soft);border-color:transparent}.legend .r{border-style:dashed}
.day h3{margin-bottom:2px}
.tasks{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-in);background:color-mix(in srgb,var(--paper) 50%,var(--card));transition:opacity .3s var(--ease)}
.task.on{opacity:.55}.task.on .tt{text-decoration:line-through}
.ck{display:flex;gap:10px;align-items:flex-start}
.ck input{width:21px;height:21px;flex:none;margin-top:2px;accent-color:var(--accent)}
.tt{flex:1}.task a{font-weight:600}
.sess-tag{display:inline-block;font-family:var(--head);font-weight:600;font-size:15px;background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:2px 10px}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.route{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.route.timeline{position:relative;padding-left:26px;gap:16px}
.route.timeline::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:1.5px;background:var(--line)}
.tl-node{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 18px 16px;box-shadow:var(--shadow)}
.tl-dot{position:absolute;left:-26px;top:20px;width:11px;height:11px;border-radius:50%;background:var(--line);border:2px solid var(--paper)}
.tl-dot.lvl0{background:var(--bad)}.tl-dot.lvl1{background:var(--hi)}.tl-dot.lvl2{background:var(--accent)}.tl-dot.lvl3{background:var(--good)}
.tl-node details summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.tl-node details summary::-webkit-details-marker{display:none}
.tl-node .nm{font-family:var(--head);font-size:19px;font-weight:var(--hw);letter-spacing:-.01em}
.tl-body{margin-top:4px}
.tl-node .bar{margin-top:12px}
.tl-node.finished{border-color:var(--good)}
:root[data-world="data"] .tl-node .nm{font-family:var(--mono);font-size:17px;letter-spacing:-.02em}
:root[data-world="data"] .tl-dot{border-radius:3px}

/* ---------- skill check ---------- */
.skillcheck-list{display:grid;gap:10px;margin-top:4px}
.skrow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.skname{font-size:14.5px;font-weight:600}
.skpills{display:flex;gap:5px;flex-wrap:wrap}
.skpill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .2s var(--ease)}
.skpill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- skill gap analysis ---------- */
.gaplist{display:grid;gap:12px}
.gaprow{display:grid;gap:6px}
.gaphead{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
.gapname{font-weight:600}
.gaplabel{color:var(--muted);font-size:13px}
.gaptrack{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.gaptrack i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .5s var(--ease)}
.gaprow.big .gaptrack i{background:var(--bad)}
.gaprow.big .gapname{color:var(--bad)}

/* ---------- projects ---------- */
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.proj{display:flex;flex-direction:column}
.proj.done{border-color:var(--good)}
.projtop{display:flex;gap:8px;margin-bottom:8px}
.proj h3{font-size:18px;letter-spacing:-.01em;margin-bottom:6px}
.lvl{display:inline-block;font-size:12px;font-weight:700;border-radius:7px;padding:2px 9px;line-height:20px}
.lvl-Start{background:var(--good-soft);color:var(--good)}.lvl-Next{background:var(--accent-soft);color:var(--accent)}.lvl-Advanced{background:var(--violet-soft);color:var(--violet)}

/* ---------- library, lessons, certs ---------- */
.trackbar{margin:18px 0 24px}
.acc{display:grid;gap:10px}
details.tp{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
details.tp>summary{list-style:none;padding:16px 18px;display:flex;gap:12px;justify-content:space-between;align-items:center;cursor:pointer;transition:background .2s var(--ease)}
details.tp>summary::-webkit-details-marker{display:none}
details.tp>summary .nm{font-family:var(--head);font-size:19px;font-weight:var(--hw);letter-spacing:-.01em}
details.tp[open]>summary{border-bottom:1px solid var(--line)}
.tp-body{padding:6px 18px 20px}
.lesson{font-size:17px;line-height:1.6;max-width:62ch;margin:16px 0 0}
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:7px}
ul.ideas.plain li{padding-left:22px;position:relative}
ul.ideas.plain li::before{content:"";position:absolute;left:4px;top:.65em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.practice{background:var(--hi-soft);border-radius:var(--r-in);padding:14px 17px;margin-top:22px}
.practice b{font-family:var(--head);font-size:17px;color:var(--hi-ink)}.practice p{margin:4px 0 0}
.res{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.res li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r-in);padding:11px 13px;background:color-mix(in srgb,var(--paper) 50%,var(--card))}
.res a{font-weight:600;text-decoration:none}.res a:hover{text-decoration:underline}
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.cert{display:flex;flex-direction:column;gap:7px}.cert h3{font-size:19px}.cert p{margin:4px 0 8px;font-size:14.5px;flex:1}
.cert-top{display:flex;justify-content:space-between;gap:8px;align-items:center}

/* ---------- tracker ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-in);padding:14px;text-align:center}
.stat b{font-family:var(--head);font-size:30px;display:block;line-height:1.1;letter-spacing:-.02em}.stat span{font-size:12.5px;color:var(--muted)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}.toolbar .grow{flex:1;min-width:200px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.app-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.app h3{font-size:22px;letter-spacing:-.01em}.app .meta{font-size:13.5px;color:var(--muted);margin-top:2px}.app .urgent{color:var(--bad);font-weight:600}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:14.5px;text-decoration:none}

/* ---------- dialogs, gate, splash ---------- */
dialog{border:0;border-radius:var(--r-card);padding:0;max-width:640px;width:calc(100% - 24px);max-height:92vh;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);color:var(--ink);overflow:auto;box-shadow:0 24px 60px -20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4);opacity:1;transform:scale(1);transition:opacity .28s var(--ease),transform .28s var(--ease),display .28s allow-discrete,overlay .28s allow-discrete}
:root[data-theme="dark"] dialog{box-shadow:0 24px 60px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) dialog{box-shadow:0 24px 60px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}}
@starting-style{dialog[open]{opacity:0;transform:scale(.96)}}
dialog:not([open]){opacity:0;transform:scale(.96);pointer-events:none}
dialog::backdrop{background:rgba(8,14,20,.45);backdrop-filter:blur(2px);opacity:1;transition:opacity .28s var(--ease),display .28s allow-discrete,overlay .28s allow-discrete}
@starting-style{dialog[open]::backdrop{opacity:0}}
.dlg{padding:24px 26px calc(30px + env(safe-area-inset-bottom,0px))}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.x{background:var(--line);border:0;color:var(--muted);font-size:13px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.gate{max-width:720px;margin:0 auto}
.gate .card{padding:28px}
.privacy{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r-in);padding:15px 17px;margin:20px 0;font-size:14.5px}
.privacy svg{flex:none;margin-top:2px}
.acct-row{display:flex;gap:14px;align-items:center;margin:16px 0 20px}
.profilecard{margin-bottom:26px}
.journeys{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.jpill{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted);transition:all .2s var(--ease)}
.jpill.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.jpill .jpct{font-family:var(--mono);font-size:12px;opacity:.75}
.jpill.jadd{border-style:dashed;color:var(--accent)}
.transitioncard{margin-bottom:22px}
.profilecard .acct-row img{width:54px;height:54px;border-radius:50%}
.avatar-fallback{width:54px;height:54px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:22px;font-weight:700;flex:none}
.acct-row img{width:54px;height:54px;border-radius:50%}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--paper);transition:opacity .5s var(--ease)}
#splash.gone{opacity:0;pointer-events:none}
#splash .lights{display:flex;gap:10px}
#splash .lights i{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:strobe 1.2s ease-in-out infinite;animation-delay:calc(var(--i) * .1s);opacity:.2}
#splash b{font-family:var(--head);font-size:30px;letter-spacing:-.02em}

/* ---------- world-specific personality (color, materials and motion differ; type and shape language stay consistent for a refined, unified feel) ---------- */
:root[data-world="cloud"] .card,:root[data-world="cloud"] .portal,:root[data-world="cloud"] .rt,:root[data-world="cloud"] details.tp{backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.6)}
:root[data-theme="dark"][data-world="cloud"] .card,:root[data-theme="dark"][data-world="cloud"] .portal,:root[data-theme="dark"][data-world="cloud"] .rt,:root[data-theme="dark"][data-world="cloud"] details.tp{box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06)}
@media (prefers-color-scheme:dark){:root[data-world="cloud"]:not([data-theme="light"]) .card,:root[data-world="cloud"]:not([data-theme="light"]) .portal,:root[data-world="cloud"]:not([data-theme="light"]) .rt,:root[data-world="cloud"]:not([data-theme="light"]) details.tp{box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06)}}
:root[data-world="cloud"] .rw{background:var(--card);border-radius:var(--r-card);padding:20px 16px 16px;box-shadow:var(--shadow)}
:root[data-world="cloud"] .lt{background:var(--paper)}
:root[data-world="cloud"] .lt[data-s=done]{background:var(--good);border-color:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
:root[data-world="cloud"] .lt[data-s=today]{background:var(--hi);border-color:var(--hi)}
:root[data-world="data"] body{letter-spacing:-.005em}
:root[data-world="data"] .facts div,:root[data-world="data"] .stat b,:root[data-world="data"] .preview .row span:last-child{font-family:var(--mono);font-weight:600;letter-spacing:-.02em}
:root[data-world="data"] .facts div{font-size:24px}
:root[data-world="data"] .rw{gap:6px 5px}
:root[data-world="data"] .lt{max-width:44px;aspect-ratio:1;border-radius:9px;font-family:var(--mono);font-size:10.5px}
:root[data-world="data"] .lt[data-s=done]{border-color:transparent;box-shadow:none;color:#fff;background:color-mix(in srgb,var(--accent) 78%,transparent)}
:root[data-world="data"] .lt[data-s=done][data-l="2"]{background:color-mix(in srgb,var(--accent) 42%,transparent);color:var(--ink)}
:root[data-world="data"] .lt[data-s=done][data-l="4"]{background:var(--accent)}
:root[data-world="data"] .lt[data-s=today]{background:var(--card);border:2px solid var(--hi);color:var(--ink);font-weight:700}
:root[data-world="data"] .lt[data-s=plan]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
:root[data-world="data"] .lt[data-s=missed]{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
:root[data-world="data"] .lt.tg{border-radius:9px;border:2px solid var(--ink)}
:root[data-world="data"] .day{position:relative;padding-left:78px}
:root[data-world="data"] .day::before{content:"In [" attr(data-in) "]:";position:absolute;left:10px;top:20px;font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:600}
:root[data-world="data"] .day.isdone::after{content:"Out[" attr(data-in) "]: done";position:absolute;left:10px;bottom:16px;font-family:var(--mono);font-size:11px;color:var(--good);font-weight:600}
:root[data-world="data"] .rt{border-left:4px solid var(--accent)}
:root[data-world="data"] .rt .nm{font-family:var(--mono);font-size:17px;letter-spacing:-.02em}
:root[data-world="data"] .sess-tag{font-family:var(--mono);font-size:12.5px}
:root[data-world="data"] .lvl{font-family:var(--mono)}
.data-only{display:block}.cloud-only,.runway-only{display:none}
:root[data-world="cloud"] .cloud-only{display:block}:root[data-world="runway"] .runway-only{display:block}
:root[data-world="cloud"] .data-only,:root[data-world="runway"] .data-only,:root[data-world="data"] .cloud-only,:root[data-world="data"] .runway-only{display:none}
:root[data-world="data"] .data-only{display:block}

@media (max-width:900px){
  .hero,.builder,.stack{grid-template-columns:1fr}
  .hero-art{justify-self:start;max-width:320px}
  .hero-art svg{max-height:200px}
  .preview{position:static}
  .board,.deck{grid-template-columns:1fr}
  .stat-box{text-align:left}
  .stats{grid-template-columns:repeat(2,1fr)}
  .portals{grid-template-columns:1fr}
  .portal svg{height:48px}
  .alt{height:190px}
  #scene-runway::before{display:none}
}
@media (max-width:700px){
  .top .wrap{gap:0 8px}
  .brand{order:1;font-size:20px}
  .top .wrap>div:last-child{order:2}
  .tabs{order:3;flex-basis:100%;justify-content:flex-start}
  .tab{padding:10px 12px 9px;font-size:14px}
  .savestate{display:none}
  .world-tag{display:none}
}
@media (max-width:560px){
  .row2{grid-template-columns:1fr}
  .tab{padding-left:10px;padding-right:10px}
  body{font-size:16px}
  :root[data-world="data"] .day{padding-left:16px}
  :root[data-world="data"] .day::before{position:static;display:block;margin-bottom:6px}
  :root[data-world="data"] .day.isdone::after{position:static;display:block;margin-top:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.plane{transition:none!important}}
@media (prefers-reduced-transparency:reduce){
  .top{background:var(--paper);backdrop-filter:none;-webkit-backdrop-filter:none}
  dialog{background:var(--paper);backdrop-filter:none;-webkit-backdrop-filter:none}
  :root[data-world="cloud"] .card,:root[data-world="cloud"] .portal,:root[data-world="cloud"] .rt,:root[data-world="cloud"] details.tp{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
}
@media (prefers-contrast:more){
  :root{--line:currentColor}
  .card,.portal,.rt,details.tp,.role,.chip,.radio-chip span,input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],textarea{border-width:1.5px}
  .btn{border-width:1.5px;border-color:var(--ink)}
  .btn.ghost{border-color:var(--ink)}
}

.still,.still *{animation:none!important}

</style>

/* Match free text ("Python, SQL and Excel") to catalog tracks */
function expandGoal(input) {
  const parts = input.split(/,|\+|&|\band\b/i).map((s) => s.trim()).filter(Boolean);
  const out = [], seen = new Set();
  parts.forEach((part) => {
    const q = " " + part.toLowerCase() + " ";
    let best = null, bestScore = 0;
    CATALOG.forEach((e) => {
      let score = q.includes(" " + e.name.toLowerCase() + " ") ? 10 : 0;
      e.keywords.forEach((k) => { if (q.includes(k.toLowerCase())) score += k.length; });
      if (score > bestScore) { best = e; bestScore = score; }
    });
    const name = best ? best.name : part.replace(/\b\w/g, (c) => c.toUpperCase());
    if (seen.has(name)) return;
    seen.add(name);
    out.push({ name, matched: !!best, topics: (best ? best.topics : genericTopics(name)) });
  });
  return out;
}

const GAP_FACTOR = [1, 0.7, 0.4, 0.15];

const askey = (track, title) => track + "|" + title;

/* ================= planner ================= */
function countStudyDays(start, end, studyDays) {
  let n = 0;
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) if (studyDays.includes(d.getDay())) n++;
  return n;
}

function buildPlan({ goal, level, hoursPerWeek, targetDate, studyDays, assessment }) {
  const start = today();
  const end = parseISO(targetDate);
  const days = Math.max(1, daysBetween(start, end));
  const capacity = Math.max(1, countStudyDays(start, end, studyDays));
  const hpd = hoursPerWeek / studyDays.length;
  const slot = Math.max(20, Math.round((hpd * 60) / 5) * 5);
  const fallbackLevel = defaultSkillLevel(level);
  const skillOf = (track, title) => {
    const v = assessment && assessment[askey(track, title)];
    return v === 0 || v > 0 ? v : fallbackLevel;
  };

  const tracks = expandGoal(goal);
  const all = [];
  const resolvedAssessment = {};
  tracks.forEach((tr) => tr.topics.forEach((tp) => {
    const lvl = skillOf(tr.name, tp.title);
    resolvedAssessment[askey(tr.name, tp.title)] = lvl;
    all.push({ ...tp, track: tr.name, skillLevel: lvl, hours: Math.max(2, Math.round(tp.hours * GAP_FACTOR[lvl])) });
  }));
  const requiredHours = sum(all.map((x) => x.hours));
  const cost = (x) => Math.max(1, Math.ceil((x.hours * 60) / slot));

  const coreCost = sum(all.filter((x) => x.priority === 1).map(cost));
  const scale = coreCost > capacity ? Math.max(0.5, capacity / coreCost) : 1;
  if (scale < 1) all.forEach((x) => (x.hours = Math.max(2, Math.floor(x.hours * scale))));

  const chosen = new Set();
  let used = 0;
  [1, 2, 3].forEach((p) => all.forEach((tp, i) => {
    if (tp.priority === p && used + cost(tp) <= capacity) { chosen.add(i); used += cost(tp); }
  }));

  const topics = [], dropped = [], sessions = [];
  all.forEach((tp, i) => {
    if (!chosen.has(i)) { dropped.push({ title: tp.title, track: tp.track, hours: tp.hours, priority: tp.priority }); return; }
    const total = Math.round(tp.hours * 60);
    const count = Math.max(1, Math.ceil(total / slot));
    topics.push({ title: tp.title, track: tp.track, hours: tp.hours, priority: tp.priority, lesson: tp.lesson, ideas: tp.ideas, practice: tp.practice, skillLevel: tp.skillLevel, res: tp.res.map((r) => (Array.isArray(r) ? r : getResArr(r))) });
    for (let n = 0; n < count; n++) {
      const m = n === count - 1 ? Math.max(15, total - slot * (count - 1)) : slot;
      sessions.push({ id: uid() + sessions.length, tk: tp.track + "|" + tp.title, n, of: count, minutes: m, doneOn: null, ck: {} });
    }
  });

  return {
    id: uid(), createdAt: toISO(start),
    world: worldOf(tracks[0] ? tracks[0].name : ""),
    inputs: { goal: goal.trim(), level, hoursPerWeek, targetDate, studyDays },
    assessment: resolvedAssessment,
    tracks: tracks.map((t) => ({ name: t.name, matched: t.matched })),
    topics, dropped, sessions, checks: {}, projects: [],
    requiredHours, compressed: scale < 1,
    plannedHours: sum(topics.map((t) => t.hours)),
    budgetHours: Math.round(capacity * hpd),
    neededPerWeek: Math.ceil(requiredHours / (days / 7)),
  };
}

/* One session per study day, starting today. Skipped days push the remaining work later. */
function schedule(plan) {
  const set = new Set(plan.inputs.studyDays);
  const t0 = today();
  const doneToday = plan.sessions.some((s) => s.doneOn === toISO(t0));
  let d = doneToday ? addDays(t0, 1) : t0;
  let guard = 0;
  plan.sessions.forEach((s) => {
    if (s.doneOn) { s.date = s.doneOn; return; }
    while (!set.has(d.getDay()) && guard++ < 4000) d = addDays(d, 1);
    s.date = toISO(d);
    d = addDays(d, 1);
  });
}
const topicOf = (plan, s) => plan.topics.find((t) => topicKey(t) === s.tk);
const nextSession = (plan) => plan.sessions.find((s) => !s.doneOn);
function projectsFor(plan) {
  const topics = plan.topics;
  if (!topics.length) return [];
  const n = topics.length;
  const cut1 = Math.max(1, Math.ceil(n / 3)), cut2 = Math.max(cut1 + 1, Math.ceil((2 * n) / 3));
  const buckets = [topics.slice(0, cut1), topics.slice(cut1, cut2), topics.slice(cut2)].filter((b) => b.length);
  const tierNames = ["Starter project", "Core project", "Capstone project"];
  const roleName = plan.tracks[0] ? plan.tracks[0].name : "this path";
  const doneMap = {}; (plan.projects || []).forEach((p) => (doneMap[p.id] = p.done));
  return buckets.map((bucket, i) => {
    const id = "proj-" + i;
    const skills = bucket.map((t) => t.title);
    const namePart = skills.length > 1 ? skills.slice(0, -1).join(", ") + " and " + skills[skills.length - 1] : skills[0];
    const blurb = "Brings together " + namePart + ". " + bucket.map((t) => t.practice).join(" ");
    return { id, tier: tierNames[i] || "Project " + (i + 1), title: roleName + ": " + (bucket[0] ? bucket[0].title : "project") + (bucket.length > 1 ? " and beyond" : ""), blurb, skills, done: !!doneMap[id] };
  });
}

function tasksFor(plan, s) {
  const tp = topicOf(plan, s);
  const res = tp.res.map(getRes);
  const first = s.n === 0, last = s.n === s.of - 1;
  const t = [];
  if (first) t.push({ t: "Read the lesson for this topic", lesson: true });
  const r = res[s.n % res.length];
  t.push({ t: `${first ? "Start" : "Continue"}: ${r.title}`, url: r.url });
  if (!first && !last) t.push({ t: "Focus on: " + tp.ideas[(s.n - 1) % tp.ideas.length] });
  if (last) { t.push({ t: "Practice: " + tp.practice }); t.push({ t: "Tick off your self-check items", lesson: true }); }
  return t;
}

function paceInfo(plan) {
  const pending = plan.sessions.filter((s) => !s.doneOn);
  const target = parseISO(plan.inputs.targetDate);
  const done = plan.sessions.length - pending.length;
  if (!pending.length) return { complete: true, done, total: plan.sessions.length };
  const finish = parseISO(pending[pending.length - 1].date);
  const late = daysBetween(target, finish);
  const remainingHours = sum(pending.map((s) => s.minutes)) / 60;
  const weeksLeft = Math.max(1, daysBetween(today(), target)) / 7;
  return { complete: false, done, total: plan.sessions.length, finish, late, needPerWeek: Math.ceil(remainingHours / weeksLeft), left: daysBetween(today(), target) };
}

function streakOf(plan) {
  const set = new Set(plan.inputs.studyDays);
  const doneDates = new Set(plan.sessions.filter((s) => s.doneOn).map((s) => s.doneOn));
  let d = today(), n = 0;
  if (!doneDates.has(toISO(d))) d = addDays(d, -1);
  const start = parseISO(plan.createdAt);
  for (let g = 0; g < 400 && d >= start; g++, d = addDays(d, -1)) {
    const iso = toISO(d);
    if (doneDates.has(iso)) n++;
    else if (set.has(d.getDay())) break;
  }
  return n;
}

function upsertJourney(fresh) {

function saveState(t) { const el = $("#savestate"); if (el) el.textContent = t; }
function cloudSave(name, data) {
  if (B.mode !== "cloud" || B.readonly) return;
  B.q[name] = data; saveState("Saving...");
  clearTimeout(B.timers[name]); B.timers[name] = setTimeout(() => flush(name), 450);
}
async function flush(name) {
  if (B.running[name]) { B.timers[name] = setTimeout(() => flush(name), 300); return; }
  B.running[name] = true;
  let d;
  try {
    while (B.q[name] !== undefined) { d = B.q[name]; delete B.q[name]; await ref(name).set(d); }
    saveState("Saved to your private space");
    setTimeout(() => { if (!Object.keys(B.q).length) saveState(""); }, 2500);
  } catch (e) {
    const code = e && e.code;
    if (code === "unavailable" || code === "resource_exhausted") { if (d && B.q[name] === undefined) B.q[name] = d; saveState("Retrying..."); setTimeout(() => flush(name), 3000); }
    else if (code === "quota_exceeded") saveState("Storage full");
    else { B.readonly = true; saveState("Not saved"); render(); }
  } finally { B.running[name] = false; }
}
/* ---- Supabase backend: the real store when this page is hosted outside claude.ai ---- */
async function sbUpsert(table, row, conflictCol) {
  clearTimeout(B.timers[table]);
  B.timers[table] = setTimeout(async () => {
    saveState("Saving...");
    try {
      const { error } = await SB.from(table).upsert(row, { onConflict: conflictCol });
      if (error) throw error;
      saveState("Saved to your private space");
      setTimeout(() => saveState(""), 2500);
    } catch (e) { saveState("Not saved"); }
  }, 450);
}
async function sbSaveApps() {
  clearTimeout(B.timers.apps);

    try {
      const del = await SB.from("applications").delete().eq("user_id", B.uid);
      if (del.error) throw del.error;
      if (S.apps.length) {
        const rows = S.apps.map((a) => ({ id: a.id, user_id: B.uid, company: a.company, role: a.role, status: a.status, applied_on: a.appliedOn || null, follow_up: a.followUp || null, link: a.link || null, notes: a.notes || null, updated_at: a.updatedAt || new Date().toISOString() }));
        const ins = await SB.from("applications").insert(rows);

}

async function initBackend() {
  const timeout = (ms) => new Promise((r) => setTimeout(() => r(null), ms));
  try {
    if (!(window.claude && window.claude.use)) throw new Error("no host");
    const caps = await Promise.race([Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("downloads")]), timeout(6000)]);
    if (!caps || !caps[0] || !caps[1]) throw new Error("no capabilities");
    B.db = caps[0]; B.user = caps[1]; B.dl = caps[2] || null;
    B.me = await B.user.me();
    if (!B.me || !B.me.id) throw new Error("no identity");
    B.uid = B.me.id;
    const [pS, plS, apS] = await Promise.all([ref("profile").get(), ref("plan").get(), ref("apps").get()]);
    const cloudPlanData = plS.exists ? plS.data() : undefined;
    const cloudApps = apS.exists ? apS.data().items : undefined;
    const cloudProfile = pS.exists && !pS.data().deleted ? pS.data() : null;
    B.mode = "cloud";
    // Prefer the private cloud copy; if it is empty, upload anything saved locally before sign-in.
    if (cloudProfile) S.profile = cloudProfile; else if (S.profile) persist.profile();
    if (cloudPlanData) {
      const shape = migratePlansShape(cloudPlanData.plans ? cloudPlanData : cloudPlanData.plan);
      S.plans = shape.plans; S.activeId = shape.activeId; S.plan = S.plans.find((p) => p.id === S.activeId) || S.plans[0] || null;
    } else if (S.plan && !plS.exists) persist.plan();
    if (cloudApps) S.apps = cloudApps; else if (S.apps.length && !apS.exists) persist.apps();
    if (S.plan) { S.plan.checks = S.plan.checks || {}; S.plan.world = S.plan.world || worldOf(S.plan.tracks[0].name); }
    if (!S.profile) S.gate = "signup";
    if (S.profile && S.profile.world) S.bWorld = S.profile.world;
    S.draft = newDraft();
    return;
  } catch (e) {
    /* not inside claude.ai, or that host declined: fall through to the real standalone backend */
  }
  try {
    if (!(window.supabase && window.supabase.createClient)) throw new Error("sdk not loaded");
    SB = window.supabase.createClient(SB_URL, SB_KEY);
    const { data: { session } } = await SB.auth.getSession();
    if (session && session.user) {
      B.mode = "supabase"; B.uid = session.user.id; B.me = { name: "", avatarUrl: "", email: session.user.email };
      await loadFromSupabase();
    } else {
      B.mode = "supabase-anon";
      S.gate = "auth";
    }
    return;
  } catch (e) {
    B.mode = "guest";

  }
}

function cloudDeck(plan, pace, next, late, still) {

function dataConsole(plan, pace, next, late, still) {

function burnup(plan) {
  const W = 960, H = 250, m = { l: 48, r: 18, t: 14, b: 34 };
  const start = parseISO(plan.createdAt), target = parseISO(plan.inputs.targetDate), t0 = today();
  const pend = plan.sessions.filter((s) => !s.doneOn), fin = pend.length ? parseISO(pend[pend.length - 1].date) : t0;
  const end = new Date(Math.max(target, fin, t0)), span = Math.max(1, daysBetween(start, end));
  const total = Math.max(1, sum(plan.sessions.map((s) => s.minutes)));
  const x = (d) => m.l + ((W - m.l - m.r) * daysBetween(start, d)) / span, y = (v) => H - m.b - ((H - m.t - m.b) * v) / total;
  const done = plan.sessions.filter((s) => s.doneOn).sort((a, b) => a.doneOn.localeCompare(b.doneOn));
  let cum = 0; const pts = [[x(start), y(0)]];
  done.forEach((s) => { cum += s.minutes; pts.push([x(parseISO(s.doneOn)), y(cum)]); });
  pts.push([x(t0), y(cum)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${x(t0).toFixed(1)} ${y(0)} L${x(start).toFixed(1)} ${y(0)} Z`;
  const hrs = (v) => (v / 60 >= 10 ? Math.round(v / 60) : Math.round(v / 6) / 10) + " h";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart of study time done against the plan">
    ${[0, 0.5, 1].map((f) => `<line class="ax" x1="${m.l}" x2="${W - m.r}" y1="${y(total * f)}" y2="${y(total * f)}"/><text class="tx" x="${m.l - 6}" y="${y(total * f) + 4}" text-anchor="end">${hrs(total * f)}</text>`).join("")}
    <line class="plan" x1="${x(start)}" y1="${y(0)}" x2="${x(target)}" y2="${y(total)}"/>
    ${pend.length ? `<line class="proj" x1="${x(t0)}" y1="${y(cum)}" x2="${x(fin)}" y2="${y(total)}"/>` : ""}
    <path class="area" d="${area}"/><path class="act" d="${line}" pathLength="1200"/>
    <line class="now" x1="${x(t0)}" x2="${x(t0)}" y1="${m.t}" y2="${H - m.b}"/>
    <text class="tx" x="${x(start)}" y="${H - 10}">${fmtShort(start).replace(/^\w+,? /, "")}</text><text class="tx" x="${x(target)}" y="${H - 10}" text-anchor="end">target ${fmtShort(target).replace(/^\w+,? /, "")}</text>
  </svg>`;
}

function paceBanner(plan, pace) {
  if (pace.complete) return `<div class="banner"><b>Plan complete</b>You finished every session. Add your project to a portfolio, then work toward the certifications below or open the Applications tab.</div>`;
  const warn = pace.late > 0 || plan.dropped.length || plan.compressed;
  let title, body;
  if (pace.late > 0) { title = `You're ${pace.late} ${pace.late === 1 ? "day" : "days"} behind`; body = `At this pace you'd finish ${fmt(pace.finish)}. Catch up by studying about ${pace.needPerWeek} hrs a week, or move your target date. Sessions you skip slide forward automatically.`; }
  else if (plan.dropped.length) { title = "Not everything fits, so we picked what matters most"; body = `Your ${plan.budgetHours} available hours cover ${plan.plannedHours} hours of core and important topics. To cover all ${plan.requiredHours} hours you'd need about ${plan.neededPerWeek} hrs a week, or a later date.`; }
  else if (plan.compressed) { title = "Fast track: core topics are shortened to fit"; body = `You get the essentials of every core topic. For full depth you'd need about ${plan.neededPerWeek} hrs a week, or a later date.`; }
  else { const spare = daysBetween(pace.finish, parseISO(plan.inputs.targetDate)); title = "On time"; body = `You're on track to finish ${fmt(pace.finish)}${spare > 0 ? `, ${spare} ${spare === 1 ? "day" : "days"} before your target` : ""}. Skip a day and the plan will slide forward.`; }
  return `<div class="banner ${warn ? "warn" : ""}"><b>${title}</b>${body}</div>`;
}

function calendarHTML(plan) {
  const set = new Set(plan.inputs.studyDays);
  const start = parseISO(plan.createdAt), target = parseISO(plan.inputs.targetDate), t0 = today(), t0i = toISO(t0);
  let end = target;
  plan.sessions.forEach((s) => { const d = parseISO(s.date); if (d > end) end = d; });
  const done = {}, pend = {}, slot = plan.sessions.length ? Math.max(...plan.sessions.map((s) => s.minutes)) : 60;
  plan.sessions.forEach((s) => { if (s.doneOn) done[s.doneOn] = (done[s.doneOn] || 0) + s.minutes; else pend[s.date] = 1; });
  let d = addDays(start, -((start.getDay() + 6) % 7));
  const last = addDays(end, 6 - ((end.getDay() + 6) % 7)), targetISO = toISO(target);
  let html = `<div class="rw" role="group" aria-label="Study days"><span></span>` + ["M", "T", "W", "T", "F", "S", "S"].map((x) => `<span class="dh">${x}</span>`).join("");
  let lastMonth = -1;
  while (d <= last) {
    const mo = addDays(d, 3).getMonth();
    html += `<span class="mo">${mo !== lastMonth ? addDays(d, 3).toLocaleDateString(undefined, { month: "short" }) : ""}</span>`; lastMonth = mo;
    for (let k = 0; k < 7; k++, d = addDays(d, 1)) {
      const iso = toISO(d);
      if (d < start || d > end) { html += `<span></span>`; continue; }
      let s = "free", lv = "";
      if (done[iso]) { s = "done"; lv = done[iso] > slot * 1.2 ? 4 : done[iso] < slot * 0.8 ? 2 : 3; }
      else if (pend[iso]) s = iso === t0i ? "today" : "plan";
      else if (!set.has(d.getDay())) s = "rest";
      else if (d < t0) s = "missed";
      const names = { done: "completed", today: "due today", plan: "planned", missed: "missed", rest: "rest day", free: "free" };
      html += `<button class="lt ${iso === targetISO ? "tg" : ""}" data-act="pick-day" data-d="${iso}" data-s="${s}" ${lv ? `data-l="${lv}"` : ""} ${S.sel === iso ? 'aria-current="date"' : ""} aria-label="${fmtLong(d)}: ${names[s]}${iso === targetISO ? ", target date" : ""}">${d.getDate()}</button>`;
    }
  }
  return html + `</div><div class="legend"><span><i class="d"></i>Done</span><span><i class="t"></i>Today</span><span><i class="p"></i>Planned</span><span><i class="m"></i>Missed</span><span><i class="r"></i>Rest day</span><span>Square = target date</span></div>`;
}

function dayPanel(plan, iso) {
  const L = WORLDS[plan.world].L, d = parseISO(iso);
  const list = plan.sessions.filter((s) => (s.doneOn === iso) || (!s.doneOn && s.date === iso));
  const head = `<h3>${fmtLong(d)}</h3>`;
  if (!list.length) {
    const set = new Set(plan.inputs.studyDays);
    let msg;
    if (iso === plan.inputs.targetDate) msg = "This is your target date. Everything planned should be done by now.";
    else if (!set.has(d.getDay())) msg = "Rest day. Rest is part of learning.";
    else if (d < today()) msg = "You didn't study this day. Any work you skipped moved forward, so nothing is lost.";
    else msg = "Nothing planned here. You're ahead of schedule or the plan finishes earlier.";
    return `${head}<p class="muted">${msg}</p><div class="row-actions"><button class="btn ghost sm" data-act="pick-day" data-d="${(nextSession(plan) || {}).date || toISO(today())}">Jump to next session</button></div>`;

      <div class="row-actions">${s.doneOn ? `<button class="btn ghost" data-act="undo" data-s="${s.id}">Mark as not done</button>` : `<button class="btn" data-act="complete" data-s="${s.id}">Mark day complete</button>`}<button class="btn ghost" data-act="lesson" data-tk="${esc(s.tk)}">Lesson & resources</button></div></div>`;
  }).join("");
}

/* hero animations run after render: split-flap board and rising plane */
function runHero() {
  document.querySelectorAll("[data-flap]").forEach((el) => {
    const text = el.dataset.flap, animate = S.flapKey !== el.dataset.key && !REDUCED;
    el.innerHTML = [...text].map((ch) => ch === " " ? `<span class="fl sp"></span>` : `<span class="fl" data-c="${esc(ch)}">${esc(ch)}</span>`).join("");
    if (!animate) return;
    const pool = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    el.querySelectorAll(".fl:not(.sp)").forEach((c, i) => {
      const fin = c.dataset.c; let k = 0; const steps = 5 + (i % 5);
      const tick = () => { if (k++ >= steps) { c.textContent = fin; return; } c.textContent = pool[Math.floor(Math.random() * pool.length)]; setTimeout(tick, 48); };
      c.textContent = " "; setTimeout(tick, 60 + i * 22);
    });
  });
  const plane = document.querySelector(".plane[data-p]");
  if (plane) {
    const p = +plane.dataset.p;
    const track = plane.closest(".alt");
    const trackH = track ? track.getBoundingClientRect().height : 230;
    const liftPx = p * trackH;
    const target = `translateY(50%) translateY(-${liftPx.toFixed(1)}px)`;
    if (plane.dataset.still === "1" || REDUCED) { plane.style.transition = "none"; plane.style.transform = target; }
    else requestAnimationFrame(() => requestAnimationFrame(() => { plane.style.transform = target; }));
  }
  const k = document.querySelector("[data-key]");
  if (k) S.flapKey = k.dataset.key;
  else if (plane) S.flapKey = (nextSession(S.plan) || { id: "done" }).id;
  else if (document.querySelector(".console")) S.flapKey = (nextSession(S.plan) || { id: "done" }).id;
}

async function exportData() {

    const a = document.createElement("a");
    a.href = url; a.download = "runway-data.json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) { /* no download support in this environment */ }
}

  if (B.mode === "supabase") { try { await Promise.all([SB.from("profiles").delete().eq("user_id", B.uid), SB.from("plans").delete().eq("user_id", B.uid), SB.from("applications").delete().eq("user_id", B.uid)]); } catch (e) {} }
  [K.plan, K.apps, K.profile, "runway.web.apps.v1"].forEach(store.del);
  S.plan = null; S.apps = []; S.profile = null; S.sel = null; S.flapKey = null; S.editing = false; S.confirm = false; S.draft = newDraft();
  S.gate = (B.mode === "cloud" || B.mode === "supabase") ? "signup" : null; S.tab = "roadmap";
  $("#dlg").close(); render();
}
async function signOut() {
  if (SB) { try { await SB.auth.signOut(); } catch (e) {} }
  B.mode = "supabase-anon"; B.uid = null; B.me = null;
  S.plan = null; S.apps = []; S.profile = null; S.sel = null; S.flapKey = null; S.editing = false; S.confirm = false; S.draft = newDraft();
  S.gate = "auth"; S.authMode = "signin"; S.authErr = ""; S.authMsg = ""; S.tab = "roadmap";
  $("#dlg").close(); render();
}
function openConfirm(title, body, act, val, label) {
  $("#dlg").innerHTML = `<div class="dlg"><div class="dlg-head"><h2>${esc(title)}</h2><button class="x" data-act="close-dlg" type="button">Close</button></div><p>${esc(body)}</p><div class="actions"><button class="btn" data-act="${act}" data-v="${esc(val)}">${esc(label)}</button><button class="btn ghost" data-act="close-dlg">Cancel</button></div></div>`;
  $("#dlg").showModal();
}

/* ================= events ================= */
const sessionById = (id) => S.plan.sessions.find((s) => s.id === id);
const setDone = (s, on) => { s.doneOn = on ? toISO(today()) : null; };
function startBuilder(role) {
  S.tab = "roadmap"; S.editing = false; S.startingNew = !!S.plan; S.sel = null; S.flapKey = null;
  S.bWorld = worldOf(role); S.draft = { ...newDraft(), goal: role };
  render(); window.scrollTo(0, 0);
}
const H = {
  tab: (el) => { S.tab = el.dataset.tab; render(); window.scrollTo(0, 0); },
  account: () => openAccount(),
  export: () => exportData(),
  wipe: (el) => { if (!el.dataset.sure) { el.dataset.sure = "1"; el.textContent = "Click again to delete everything"; return; } wipeAll(); },
  portal: (el) => { readDraft(); setBuilderWorld(el.dataset.v); },
  "gate-world": (el) => { const n = $("#pname"); if (n) S.gateName = n.value; S.bWorld = el.dataset.v; render(); },
  "auth-toggle": () => { S.authMode = S.authMode === "signup" ? "signin" : "signup"; S.authErr = ""; render(); },
  role: (el) => { const n = el.dataset.v; S.draft.goal = n; S.draft.assessment = {}; const g = $("#goal"); if (g) g.value = n; setBuilderWorld(worldOf(n)); $("#roles").innerHTML = rolesHTML(); syncSkillCheck(); updatePreview(); },
  "skill-lvl": (el) => { S.draft.assessment[el.dataset.k] = +el.dataset.lvl; syncSkillCheck(); updatePreview(); },
  "date-in": (el) => { $("#date").value = toISO(addDays(today(), +el.dataset.n)); readDraft(); updatePreview(); },
  "cancel-edit": () => { S.editing = false; S.startingNew = false; render(); },
  "edit-plan": () => { const i = S.plan.inputs; S.draft = { goal: i.goal, level: i.level, hours: i.hoursPerWeek, date: i.targetDate, days: [...i.studyDays], assessment: { ...(S.plan.assessment || {}) } }; S.bWorld = S.plan.world; S.editing = true; render(); window.scrollTo(0, 0); },
  "new-roadmap": () => {
    if (!S.confirm) { S.confirm = true; render(); return; }
    const removedId = removeActiveJourney();
    S.confirm = false; S.sel = null; S.flapKey = null; S.draft = newDraft();
    if (removedId) persist.removePlan(removedId); else persist.plan();
    render(); window.scrollTo(0, 0);
  },
  "pick-day": (el) => { S.sel = el.dataset.d; render(); if (matchMedia("(max-width:900px)").matches) { const d = $(".day"); if (d && d.scrollIntoView) d.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" }); } },
  lesson: (el) => openLesson(el.dataset.tk),
  task: (el) => {
    const s = sessionById(el.dataset.s), tasks = tasksFor(S.plan, s);
    s.ck[+el.dataset.i] = el.checked;
    const all = tasks.every((_, k) => s.ck[k]);
    if (all && !s.doneOn) setDone(s, true); else if (!all && s.doneOn) setDone(s, false);
    persist.plan(); render();
  },
  complete: (el) => { const s = sessionById(el.dataset.s); tasksFor(S.plan, s).forEach((_, k) => (s.ck[k] = true)); setDone(s, true); S.sel = null; persist.plan(); render(); },
  undo: (el) => { const s = sessionById(el.dataset.s); s.ck = {}; setDone(s, false); persist.plan(); render(); },
  selfcheck: (el) => { const k = el.dataset.key; S.plan.checks[k] = S.plan.checks[k] || []; S.plan.checks[k][+el.dataset.i] = el.checked; persist.plan(); },
  lib: (el) => { S.lib = el.dataset.v; render(); },
  cert: (el) => { S.certTrack = el.dataset.v; render(); },
  "toggle-project": (el) => {
    const id = el.dataset.id, on = el.checked;
    const list = S.plan.projects || (S.plan.projects = []);
    const row = list.find((p) => p.id === id);
    if (row) row.done = on; else list.push({ id, done: on });
    persist.plan(); render();
  },
  "build-for": (el) => startBuilder(el.dataset.v),
  "switch-journey": (el) => {
    const p = S.plans.find((x) => x.id === el.dataset.id); if (!p) return;
    setActivePlan(p); S.bWorld = p.world; S.tab = "roadmap"; S.editing = false; S.startingNew = false; S.sel = null; S.flapKey = null;
    persist.profile(); render(); window.scrollTo(0, 0);
  },
  filter: (el) => { S.filter = el.dataset.v; render(); },
  "add-app": () => openAppDialog(),
  "edit-app": (el) => openAppDialog(S.apps.find((a) => a.id === el.dataset.id)),
  advance: (el) => { S.apps = S.apps.map((a) => (a.id === el.dataset.id ? { ...a, status: NEXT[a.status], updatedAt: new Date().toISOString() } : a)); persist.apps(); render(); },
  "close-dlg": () => $("#dlg").close(),
  signout: () => signOut(),
  fu: (el) => { $("#followUp").value = el.dataset.n ? toISO(addDays(today(), +el.dataset.n)) : ""; },
  "delete-app": (el) => {
    if (!el.dataset.sure) { el.dataset.sure = "1"; el.textContent = "Click again to delete"; return; }
    S.apps = S.apps.filter((a) => a.id !== el.dataset.id); persist.apps(); $("#dlg").close(); render();
  },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el && H[el.dataset.act]) H[el.dataset.act](el, e);
  if (e.target === $("#dlg")) $("#dlg").close();
});
function onDraftEvent(e) {
  if (!e.target.closest || !e.target.closest("#plan-form")) return;
  readDraft();
  if (e.target.id === "goal" && e.type === "input") {
    const p = expandGoal(S.draft.goal.trim() || "").find((x) => x.matched);
    if (p && worldOf(p.name) !== S.bWorld) { setBuilderWorld(worldOf(p.name)); syncSkillCheck(); updatePreview(); return; }
    const r = $("#roles"); if (r) r.innerHTML = rolesHTML();
  }
  if (e.target.id === "goal" || e.target.name === "level") syncSkillCheck();
  updatePreview();
}
document.addEventListener("input", (e) => { if (e.target.id === "q") { S.query = e.target.value; renderAppList(); return; } onDraftEvent(e); });
document.addEventListener("change", onDraftEvent);

function setErrors(form, errs) {
  form.querySelectorAll("[data-err]").forEach((n) => (n.textContent = errs[n.dataset.err] || ""));
  const first = Object.keys(errs)[0];
  if (first) { const f = form.elements[first]; if (f && f.focus && !f.length) f.focus(); }
  return !first;
}
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const form = e.target;
  if (form.id === "plan-form") {
    readDraft();
    const f = draftParsed(), errs = {};
    if (f.goal.length < 2) errs.goal = 'Enter a role or skill, like "Data Analyst" or "Python".';
    if (!(f.hours > 0 && f.hours <= 80)) errs.hours = "Enter between 1 and 80 hours a week.";
    if (!f.date) errs.date = "Choose a date."; else if (daysBetween(today(), f.date) < 7) errs.date = "Choose a date at least one week from today.";
    if (!f.days.length) errs.days = "Pick at least one study day.";
    if (!setErrors(form, errs)) return;
    const fresh = buildPlan({ goal: f.goal, level: f.level, hoursPerWeek: f.hours, targetDate: toISO(f.date), studyDays: f.days, assessment: f.assessment });
    if (!fresh.topics.length) { setErrors(form, { date: "That's too little time to fit even one topic. Add study hours or days, or choose a later date." }); return; }
    const old = S.plan;
    if (S.editing && old) {
      const doneMap = {}; old.sessions.filter((s) => s.doneOn).forEach((s) => (doneMap[s.tk + "#" + s.n] = s));
      fresh.sessions.forEach((s) => { const o = doneMap[s.tk + "#" + s.n]; if (o) { s.doneOn = o.doneOn; s.ck = o.ck; } });
      fresh.checks = old.checks; fresh.createdAt = old.createdAt; fresh.id = old.id; fresh.projects = old.projects;
      setActivePlan(fresh);
    } else {
      upsertJourney(fresh);
    }
    S.bWorld = fresh.world; S.editing = false; S.startingNew = false; S.sel = null; S.flapKey = null; S.confirm = false;
    persist.plan(); persist.profile(); render(); window.scrollTo(0, 0);
  }
  if (form.id === "auth-form") {
    const email = ($("#aemail").value || "").trim(), password = $("#apass").value || "";
    S.authErr = "";
    (async () => {
      try {
        const mode = S.authMode || "signin";
        const { data, error } = mode === "signup" ? await SB.auth.signUp({ email, password }) : await SB.auth.signInWithPassword({ email, password });
        if (error) throw error;
        if (mode === "signup" && !data.session) {
          S.authErr = ""; S.authMsg = "Check your email to confirm your account, then sign in.";
          S.authMode = "signin"; render(); return;
        }
        B.mode = "supabase"; B.uid = data.session.user.id; B.me = { name: "", avatarUrl: "", email: data.session.user.email };
        S.gate = null; S.authMsg = "";
        await loadFromSupabase();
        render(); window.scrollTo(0, 0);
      } catch (err) {
        S.authErr = (err && err.message) || "Something went wrong. Try again.";
        render();
      }
    })();
  }
  if (form.id === "signup-form") {
    const v = Object.fromEntries(new FormData(form).entries()), errs = {};
    const name = (v.name || "").trim(), hours = parseFloat(v.hours);
    if (!name) errs.name = "Tell us what to call you."; if (!(hours > 0 && hours <= 80)) errs.hours = "Enter between 1 and 80 hours a week.";
    S.gateName = v.name;
    if (!setErrors(form, errs)) return;
    S.profile = { name, world: S.bWorld, hours, createdAt: toISO(today()) }; S.gate = null; S.gateName = undefined; S.draft = newDraft();
    persist.profile(); render(); window.scrollTo(0, 0);
  }
  if (form.id === "profile-form") {
    const name = ($("#ename").value || "").trim();
    if (!name) { setErrors(form, { name: "Enter a name." }); return; }
    S.profile = { ...S.profile, name }; persist.profile(); $("#dlg").close(); render();
  }
  if (form.id === "app-form") {
    const v = Object.fromEntries(new FormData(form).entries()), errs = {};
    if (!v.company.trim()) errs.company = "Enter the company name.";
    if (!v.role.trim()) errs.role = "Enter the job title.";
    if (!parseISO(v.appliedOn)) errs.appliedOn = "Choose a date.";
    if (!setErrors(form, errs)) return;
    const rec = { company: v.company.trim(), role: v.role.trim(), status: v.status, appliedOn: v.appliedOn, followUp: v.followUp || "", link: v.link.trim(), notes: v.notes, updatedAt: new Date().toISOString() };
    if (form.dataset.id) S.apps = S.apps.map((a) => (a.id === form.dataset.id ? { ...a, ...rec } : a)); else S.apps = [{ id: uid(), ...rec }, ...S.apps];
    persist.apps(); $("#dlg").close(); render();
  }
});

/* ================= boot ================= */
function hideSplash() { const s = $("#splash"); if (!s) return; s.classList.add("gone"); setTimeout(() => s.remove(), 700); }
render();
initBackend().then(() => { render(); hideSplash(); }).catch(() => { B.mode = "guest"; render(); hideSplash(); });
</script>
